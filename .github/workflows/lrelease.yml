name: Build and Release with Provenance
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package release zip
        run: zip -r focuspulse_pro_v1.0.zip . -x "*.git*"
      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: focuspulse_pro_v1.0.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v1.0.0
          git push origin v1.0.0 --force
          gh release create v1.0.0 focuspulse_pro_v1.0.zip --title "FocusPulse Pro v1.0.0" --notes "Official release with build provenance" || gh release upload v1.0.0 focuspulse_pro_v1.0.zip --clobber
